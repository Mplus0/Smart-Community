# 模型类别顺序与原权重一致；mission_confidence 保留总入口阈值。
detectors:
  people_detector:
    model_path: $(find community_perception)/models/person.onnx
    model_name: people_detector
    conf_threshold: 0.5
    iou_threshold: 0.4
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/people
    class_names:
    - community_person
    - outsider
    save_classes:
    - 0
    - 1
    service_name: /people_detector/detect
  traffic_light_detector:
    model_path: $(find community_perception)/models/traffic_light.onnx
    model_name: traffic_light_detector
    conf_threshold: 0.9
    iou_threshold: 0.4
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/traffic_light
    class_names:
    - stop
    - go
    save_classes:
    - 0
    - 1
    service_name: /traffic_light_detector/detect
  fire_detector:
    model_path: $(find community_perception)/models/fire.onnx
    model_name: fire_detector
    conf_threshold: 0.9
    iou_threshold: 0.4
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/fire
    class_names:
    - fire
    save_classes:
    - 0
    service_name: /fire_detector/detect
  trash_bin_detector:
    model_path: $(find community_perception)/models/trashbin.onnx
    model_name: trash_bin_detector
    conf_threshold: 0.5
    iou_threshold: 0.4
    letterbox: true
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/trash_bin
    class_names:
    - blue_close
    - blue_open
    - grey_close
    - grey_open
    - green_close
    - green_open
    - red_close
    - red_open
    save_classes:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    service_name: /trash_bin_detector/detect
  waste_detector:
    model_path: $(find community_perception)/models/trash_sorting.onnx
    model_name: waste_detector
    conf_threshold: 0.5
    iou_threshold: 0.4
    letterbox: true
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/waste
    class_names:
    - hazardous_trash
    - food_trash
    - other_trash
    - recyclable_trash
    save_classes: [0, 1, 2, 3]
    service_name: /waste_detector/detect
  bicycle_detector:
    model_path: $(find community_perception)/models/byc.onnx
    model_name: bicycle_detector
    conf_threshold: 0.85
    iou_threshold: 0.4
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/bicycle
    class_names:
    - stand
    - fall
    save_classes:
    - 0
    - 1
    service_name: /bicycle_detector/detect
  obstacle_detector:
    model_path: $(find community_perception)/models/obstacle.onnx
    model_name: obstacle_detector
    conf_threshold: 0.5
    iou_threshold: 0.4
    save_enabled: false
    save_dir: $(env HOME)/.ros/community/detections/obstacle
    class_names:
    - obstacle
    save_classes:
    - 0
    service_name: /obstacle_detector/detect
mission_confidence:
  obstacle_detector: 0.5
  people_detector: 0.75
  traffic_light_detector: 0.75
  trash_bin_detector: 0.75
  waste_detector: 0.5
  fire_detector: 0.9
  bicycle_detector: 0.85
