# AMCL 全向定位，使用修正后的里程计运动噪声模型。
odom_model_type: omni-corrected
gui_publish_rate: 50.0
laser_max_range: 6
laser_max_beams: 360
min_particles: 1500
max_particles: 4000
kld_err: 0.05
kld_z: 0.99
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.2
laser_z_hit: 0.75
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.1
laser_sigma_hit: 0.15
laser_lambda_short: 0.1
laser_model_type: likelihood_field
laser_likelihood_max_dist: 2.0
update_min_d: 0.02
update_min_a: 0.03
odom_frame_id: odom
base_frame_id: base_link
global_frame_id: /map
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
