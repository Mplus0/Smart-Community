#机器人几何参，如果机器人是圆形，设置 robot_radius,如果是其他形状设置 footprint
#robot_radius: 0.12
footprint: [[-0.15, -0.14], [-0.15, 0.14], [0.18, 0.14], [0.19, -0.14]]

# 全局、局部代价地图共用导航地图；静态障碍不会被激光清除。
plugins:
  - {name: static_layer, type: "costmap_2d::StaticLayer"}
  - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
  - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

static_layer:
  map_topic: /navigation_map

obstacle_layer:
  combination_method: 1 # 取最大代价，保留静态层中的禁行区域。
  transform_tolerance: 0.5
  obstacle_range: 3.0
  raytrace_range: 3.5
  observation_sources: scan
  scan: {sensor_frame: laser_link, data_type: LaserScan, topic: scan, marking: true, clearing: true}
