TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: map

  # Initial real-robot settings; retain the existing 5 Hz controller rate.
  teb_autosize: true
  dt_ref: 0.2
  dt_hysteresis: 0.02
  max_global_plan_lookahead_dist: 1.0
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  feasibility_check_no_poses: -1

  # Omnidirectional chassis; match the active DWA velocity/acceleration limits.
  max_vel_x: 0.27
  max_vel_x_backwards: 0.27
  max_vel_y: 0.13
  max_vel_trans: 0.18
  max_vel_theta: 0.5
  acc_lim_x: 0.5
  acc_lim_y: 0.5
  # DWA currently uses acc_lim_theta=3.2, not the legacy acc_lim_th=2 key.
  acc_lim_theta: 3.2
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false
  weight_kinematics_nh: 0.0

  # Same base_link polygon as costmap_common_params.yaml.
  footprint_model:
    type: polygon
    vertices: [[-0.15, -0.14], [-0.15, 0.14], [0.18, 0.14], [0.19, -0.14]]
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.15
  free_goal_vel: false
  complete_global_plan: true

  # Consume the existing navigation-map and laser costmap obstacles.
  include_costmap_obstacles: true
  include_dynamic_obstacles: false
  min_obstacle_dist: 0.08
  inflation_dist: 0.15
  costmap_obstacles_behind_robot_dist: 1.0
  penalty_epsilon: 0.02
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  enable_homotopy_class_planning: false
