# 识别阈值与模型标签映射。
recognition_rules:
  person_y_ratio: 0.45
  person_x_ratio: 0.4
  parking_margin_px: 50.0
  reference_width: 1280.0
  parking_y_ratio: 0.6
  parking_area_ratio: 0.5
  vehicle_left_ratio: 0.15
  vehicle_right_ratio: 0.7
  vehicle_overlap_ratio: 0.4
  # ROI 扩展量以最大桶框的宽/高为单位。
  trash_roi_side: 0.5
  trash_roi_top: 0.1
  trash_roi_bottom: 0.5
  trash_match_x_ratio: 0.6
  trash_match_y_start: 0.45
  bin_types:
    red: 有害
    green: 厨余
    grey: 其他
    blue: 可回收
  waste_types:
    hazardous_trash: 有害
    food_trash: 厨余
    other_trash: 其他
    recyclable_trash: 可回收
    button_battery: 有害
    fluorescent_lamp: 有害
    used_film_roll: 有害
    paint: 有害
    pills: 有害
    mercury_thermometer: 有害
    fruit_core: 厨余
    fish_bone: 厨余
    vegetable_leaves: 厨余
    bread: 厨余
    tea_leaves: 厨余
    leftover_rice: 厨余
    cigarette_butt: 其他
    tissue: 其他
    broken_ceramic: 其他
    shell: 其他
    disposable_chopsticks: 其他
    discarded_glasses: 其他
    plastic_bottle: 可回收
    newspaper: 可回收
    glass_bottle: 可回收
    beverage_can: 可回收
    old_clothing: 可回收
    cardboard_box: 可回收
