# Values transcribed from the official hardware parameter table supplied by the user.
robot:
  empty_mass_kg: 5.2
  payload_kg: 5.0
  max_speed_mps: 0.6
  motion_model: mecanum
  drive: four_wheel_dc_geared_motor

lidar:
  max_range_m: 10.0
  scan_frequency_hz_range: [5.0, 12.0]
  scan_angle_deg: 360.0
  angular_resolution_deg_range: [0.43, 0.86]
  measurement_rate_hz: 5000

depth_camera:
  technology: monocular_structured_light
  working_range_m: [0.6, 8.0]
  accuracy_at_1m_mm: 3.0
  max_depth_resolution: [1280, 1024]

imu:
  interface: [TTL_serial, RS232]
  dimensions: "3-axis accelerometer + 3-axis gyroscope"
  accel_range_g: 16.0
  gyro_range_dps: 2000.0
  accel_stability_g: 0.01
  gyro_stability_dps: 0.05
  attitude_accuracy: 0.01
  sample_rate_hz_range: [0.1, 200.0]

ultrasonic:
  used_in_current_model: false
