frequency: 50.0
sensor_timeout: 0.1
two_d_mode: true

transform_time_offset: 0.0
transform_timeout: 0.0

print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

# Wheel odometry:
# [x, y, z,
#  roll, pitch, yaw,
#  vx, vy, vz,
#  vroll, vpitch, vyaw,
#  ax, ay, az]
odom0: /wheel/odom
odom0_config: [false, false, false,
               false, false, false,
               true,  true,  false,
               false, false, false,
               false, false, false]

odom0_queue_size: 10
odom0_differential: false
odom0_relative: false

# IMU:
# only fuse absolute yaw and yaw rate
imu0: /imu/data
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              false, false, false]

imu0_queue_size: 20
imu0_differential: false

# Treat the first IMU orientation as yaw = 0 for local odometry.
imu0_relative: true
