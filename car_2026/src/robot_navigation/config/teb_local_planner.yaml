TebLocalPlannerROS:

  # =======================================================
  # Frames
  # =======================================================

  odom_topic: /odometry/filtered
  map_frame: map


  # =======================================================
  # Robot / trajectory
  # =======================================================

  teb_autosize: true

  dt_ref: 0.30
  dt_hysteresis: 0.10

  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false

  max_global_plan_lookahead_dist: 1.0

  feasibility_check_no_poses: 5


  # =======================================================
  # TEB velocity limits (lateral motion disabled)
  # =======================================================

  max_vel_x: 0.25
  max_vel_x_backwards: 0.08

  max_vel_y: 0.0

  max_vel_theta: 0.30


  # =======================================================
  # Acceleration limits
  # =======================================================

  acc_lim_x: 0.25
  acc_lim_y: 0.0
  acc_lim_theta: 0.35


  # =======================================================
  # Differential-drive-style navigation (in-place rotation allowed)
  # =======================================================

  min_turning_radius: 0.0

  footprint_model:
    type: "polygon"
    vertices:
      - [-0.155, -0.141]
      - [-0.155,  0.141]
      - [ 0.155,  0.141]
      - [ 0.155, -0.141]


  # =======================================================
  # Goal tolerance
  # =======================================================

  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.12

  free_goal_vel: false
  complete_global_plan: true


  # =======================================================
  # Obstacles
  # =======================================================

  min_obstacle_dist: 0.04

  inflation_dist: 0.12

  include_costmap_obstacles: true

  costmap_obstacles_behind_robot_dist: 1.0

  obstacle_poses_affected: 15


  # =======================================================
  # Optimization
  # =======================================================

  no_inner_iterations: 5
  no_outer_iterations: 4

  optimization_activate: true
  optimization_verbose: false


  weight_max_vel_x: 2.0
  weight_max_vel_y: 2.0
  weight_max_vel_theta: 1.0

  weight_acc_lim_x: 1.0
  weight_acc_lim_y: 1.0
  weight_acc_lim_theta: 1.0

  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 10.0

  weight_optimaltime: 1.0

  weight_obstacle: 50.0
  weight_inflation: 0.20


  # =======================================================
  # Homotopy
  # 第一阶段先关闭，减少变量
  # =======================================================

  enable_homotopy_class_planning: false
