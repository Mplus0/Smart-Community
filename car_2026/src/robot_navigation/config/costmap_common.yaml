# =========================================================
# Robot footprint
# =========================================================

# 按车体及轮子外缘设置近似矩形，与 TEB polygon footprint 保持一致
footprint:
  - [-0.155, -0.141]
  - [-0.155,  0.141]
  - [ 0.155,  0.141]
  - [ 0.155, -0.141]

footprint_padding: 0.005


# =========================================================
# Obstacle detection
# =========================================================

obstacle_range: 3.0
raytrace_range: 4.0

observation_sources: laser_scan_sensor

laser_scan_sensor:
  sensor_frame: laser_link
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
  inf_is_valid: true


# =========================================================
# Costmap
# =========================================================

transform_tolerance: 0.5

# 你的地图分辨率本身就是 0.02 m
resolution: 0.02
