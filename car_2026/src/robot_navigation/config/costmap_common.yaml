# =========================================================
# Robot footprint
# =========================================================

# 先使用近似矩形，后续可根据机器人真实尺寸再精调
footprint:
  - [-0.17, -0.14]
  - [-0.17,  0.14]
  - [ 0.17,  0.14]
  - [ 0.17, -0.14]

footprint_padding: 0.01


# =========================================================
# Obstacle detection
# =========================================================

obstacle_range: 3.0
raytrace_range: 4.0

observation_sources: laser_scan_sensor

laser_scan_sensor:
  sensor_frame: laser_link
  data_type: LaserScan
  topic: /scan
  marking: true
  clearing: true
  inf_is_valid: true


# =========================================================
# Costmap
# =========================================================

transform_tolerance: 0.5

# 你的地图分辨率本身就是 0.02 m
resolution: 0.02
